</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="">
    <label for ="">Name :</label><br>
    <input type ="text" placeholder ="Enter Name" id="user_name" required>
    <br><br>
    <label for ="">Email :</label><br>
    <input type ="email" placeholder ="Enter Email" id="user_email" required>
    <br><br>
    <label for ="">Password :</label><br>
    <input type ="password"  id="user_password" required>
    <br>
    <p>Gender :<br>
        <label for="male">Male</label>
        <input type ="radio" id ="male" value="male" name="gender" required>
        <label for="female">Female</label>
        <input type ="radio" id="female" value="female" name ="gender">
    </p>
    <p>Skills: <br>
        <label for="html">HTML</label>
        <input type = "checkbox" id = "html" value ="HTML">
        <label for="html">CSS</label>
        <input type = "checkbox" id = "css" value ="CSS">
        <label for="JavaScript">JavaScript</label>
        <input type = "checkbox" id = "html" value ="JavaScript">
    </p>
    <label for ="">Date Of Birth :</label><br>
    <input type ="date"><br>
    <button type ="submit">Register</button>
</form>
